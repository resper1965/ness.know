# Testes e checagem de tipos em todo PR e em todo push na main.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # node:sqlite (usado nos testes) vem do Node 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
